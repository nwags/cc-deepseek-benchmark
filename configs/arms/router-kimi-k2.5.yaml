arm_id: router-kimi-k2.5
display_name: Router-mediated Kimi K2.5 via LiteLLM
provider: moonshot-kimi
agent: claude-code
router: litellm
model: router-kimi-k2.5
backend_model: kimi-k2.5
expected_observed_model: router-kimi-k2.5
job_dir_name: arm-router-kimi-k2.5
secret_file: .secrets/litellm.env
secret_env_map:
  ANTHROPIC_AUTH_TOKEN: LITELLM_MASTER_KEY
env:
  ANTHROPIC_BASE_URL: http://127.0.0.1:4000
  ANTHROPIC_MODEL: router-kimi-k2.5
  ANTHROPIC_DEFAULT_OPUS_MODEL: router-kimi-k2.5
  ANTHROPIC_DEFAULT_SONNET_MODEL: router-kimi-k2.5
  ANTHROPIC_DEFAULT_HAIKU_MODEL: router-kimi-k2.5
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1"
  CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
agent_env_keys:
  - ANTHROPIC_BASE_URL
  - ANTHROPIC_AUTH_TOKEN
  - ANTHROPIC_MODEL
  - ANTHROPIC_DEFAULT_OPUS_MODEL
  - ANTHROPIC_DEFAULT_SONNET_MODEL
  - ANTHROPIC_DEFAULT_HAIKU_MODEL
  - CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY
  - CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS
  - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
clear_env:
  - ANTHROPIC_API_KEY
  - DEEPSEEK_API_KEY
  - OPENAI_API_KEY
  - GEMINI_API_KEY
  - XAI_API_KEY
  - MOONSHOT_API_KEY
  - DASHSCOPE_API_KEY
  - ZAI_API_KEY
  - CLAUDE_CODE_SUBAGENT_MODEL
  - CLAUDE_CODE_EFFORT_LEVEL
status: planned
notes:
  - LiteLLM-mediated Moonshot/Kimi arm. Verify availability and exact slug before paid canaries.
