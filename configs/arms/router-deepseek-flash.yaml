arm_id: router-deepseek-flash
display_name: Router-mediated DeepSeek V4-Flash via LiteLLM
provider: deepseek
agent: claude-code
router: litellm
model: router-deepseek-flash
backend_model: deepseek-v4-flash
expected_observed_model: router-deepseek-flash
job_dir_name: arm-router-deepseek-flash
secret_file: .secrets/litellm.env
secret_env_map:
  ANTHROPIC_AUTH_TOKEN: LITELLM_MASTER_KEY
env:
  ANTHROPIC_BASE_URL: http://127.0.0.1:4000
  ANTHROPIC_MODEL: router-deepseek-flash
  ANTHROPIC_DEFAULT_OPUS_MODEL: router-deepseek-flash
  ANTHROPIC_DEFAULT_SONNET_MODEL: router-deepseek-flash
  ANTHROPIC_DEFAULT_HAIKU_MODEL: router-deepseek-flash
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1"
  CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
agent_env_keys:
  - ANTHROPIC_BASE_URL
  - ANTHROPIC_AUTH_TOKEN
  - ANTHROPIC_MODEL
  - ANTHROPIC_DEFAULT_OPUS_MODEL
  - ANTHROPIC_DEFAULT_SONNET_MODEL
  - ANTHROPIC_DEFAULT_HAIKU_MODEL
  - CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY
  - CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS
  - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
clear_env:
  - ANTHROPIC_API_KEY
  - DEEPSEEK_API_KEY
  - OPENAI_API_KEY
  - GEMINI_API_KEY
  - XAI_API_KEY
  - MOONSHOT_API_KEY
  - DASHSCOPE_API_KEY
  - ZAI_API_KEY
  - CLAUDE_CODE_SUBAGENT_MODEL
  - CLAUDE_CODE_EFFORT_LEVEL
status: planned
notes:
  - LiteLLM-mediated DeepSeek Flash arm. Verify LiteLLM/provider slug before paid canaries.
