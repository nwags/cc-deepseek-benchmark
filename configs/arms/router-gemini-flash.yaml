  CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: '1'
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
agent_env_keys:
- ANTHROPIC_BASE_URL
- ANTHROPIC_AUTH_TOKEN
- ANTHROPIC_MODEL
- ANTHROPIC_DEFAULT_OPUS_MODEL
- ANTHROPIC_DEFAULT_SONNET_MODEL
- ANTHROPIC_DEFAULT_HAIKU_MODEL
- CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY
- CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS
- CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
clear_env:
- ANTHROPIC_API_KEY
- DEEPSEEK_API_KEY
- OPENAI_API_KEY
- GEMINI_API_KEY
- XAI_API_KEY
- MOONSHOT_API_KEY
- DASHSCOPE_API_KEY
- ZAI_API_KEY
- CLAUDE_CODE_SUBAGENT_MODEL
- CLAUDE_CODE_EFFORT_LEVEL
status: planned
notes:
- LiteLLM-mediated Gemini Flash arm. Verify availability and exact slug before paid
  canaries.
- WebSearch/WebFetch denied for benchmark-contamination mitigation.
- Claude Code WebSearch/WebFetch denied via Harbor disallowed_tools for benchmark-contamination
  mitigation.
- Canary 2026-06-02__17-59-33 reached Gemini but entered Plan Mode and stopped
  before implementation; reward 0.0, no Harbor exception.
- Canary 2026-06-02__20-30-15 added EnterPlanMode/ExitPlanMode/AskUserQuestion
  to disallowed_tools; route still reached Gemini but hit Gemini free-tier quota
