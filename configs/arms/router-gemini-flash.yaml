arm_id: router-gemini-flash
display_name: Router-mediated Gemini Flash via LiteLLM
provider: google-gemini
agent: claude-code
router: litellm
model: router-gemini-flash
backend_model: gemini-3.5-flash
expected_observed_model: router-gemini-flash
job_dir_name: arm-router-gemini-flash
secret_file: .secrets/litellm.env
secret_env_map:
  ANTHROPIC_AUTH_TOKEN: LITELLM_MASTER_KEY
env:
  ANTHROPIC_BASE_URL: http://172.17.0.1:4000
  ANTHROPIC_MODEL: router-gemini-flash
  ANTHROPIC_DEFAULT_OPUS_MODEL: router-gemini-flash
  ANTHROPIC_DEFAULT_SONNET_MODEL: router-gemini-flash
  ANTHROPIC_DEFAULT_HAIKU_MODEL: router-gemini-flash
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1"
  CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
agent_env_keys:
  - ANTHROPIC_BASE_URL
  - ANTHROPIC_AUTH_TOKEN
  - ANTHROPIC_MODEL
  - ANTHROPIC_DEFAULT_OPUS_MODEL
  - ANTHROPIC_DEFAULT_SONNET_MODEL
  - ANTHROPIC_DEFAULT_HAIKU_MODEL
  - CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY
  - CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS
  - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
clear_env:
  - ANTHROPIC_API_KEY
  - DEEPSEEK_API_KEY
  - OPENAI_API_KEY
  - GEMINI_API_KEY
  - XAI_API_KEY
  - MOONSHOT_API_KEY
  - DASHSCOPE_API_KEY
  - ZAI_API_KEY
  - CLAUDE_CODE_SUBAGENT_MODEL
  - CLAUDE_CODE_EFFORT_LEVEL
status: planned
notes:
  - LiteLLM-mediated Gemini Flash arm. Verify availability and exact slug before paid canaries.
