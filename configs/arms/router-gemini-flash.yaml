arm_id: router-gemini-flash
display_name: Router-mediated Gemini Flash
provider: google-gemini
agent: claude-code
router: bifrost-or-claude-code-router
model: anthropic/claude-sonnet-4-6
backend_model: gemini-3.5-flash
expected_observed_model: gemini-3.5-flash
job_dir_name: arm-router-gemini-flash
secret_file: .secrets/gemini.env
secret_env_map:
  GEMINI_API_KEY: GEMINI_API_KEY
env:
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
router_notes:
  - This arm requires a router/gateway that exposes an Anthropic-compatible endpoint to Claude Code.
  - Populate ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN mapping after choosing Bifrost or Claude Code Router.
status: planned
notes:
  - Phase 3 canary/smoke only until router setup is verified.
