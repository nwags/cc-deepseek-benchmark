arm_id: router-gemini-flash
display_name: Router-mediated Gemini Flash via LiteLLM
provider: google-gemini
agent: claude-code
router: litellm
model: router-gemini-flash
backend_model: gemini-3.5-flash
expected_observed_model: router-gemini-flash
job_dir_name: arm-router-gemini-flash
secret_file: .secrets/litellm.env
secret_env_map:
  ANTHROPIC_AUTH_TOKEN: LITELLM_MASTER_KEY
env:
  ANTHROPIC_BASE_URL: http://172.17.0.1:4000
  ANTHROPIC_MODEL: router-gemini-flash
  ANTHROPIC_DEFAULT_OPUS_MODEL: router-gemini-flash
  ANTHROPIC_DEFAULT_SONNET_MODEL: router-gemini-flash
