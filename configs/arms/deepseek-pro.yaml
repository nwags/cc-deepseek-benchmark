arm_id: deepseek-pro
display_name: DeepSeek V4-Pro
provider: deepseek
agent: claude-code
model: anthropic/claude-sonnet-4-6
backend_model: deepseek-v4-pro[1m]
expected_observed_model: deepseek-v4-pro[1m]
job_dir_name: arm-deepseek-pro
job_dir_name_by_phase:
  phase1: arm-b-deepseek-pro
  phase2: arm-deepseek-pro
secret_file: .secrets/deepseek.env
secret_env_map:
  ANTHROPIC_AUTH_TOKEN: DEEPSEEK_API_KEY
env:
  ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
  ANTHROPIC_MODEL: deepseek-v4-pro[1m]
  ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-pro[1m]
  ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro[1m]
  ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
clear_env:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_SUBAGENT_MODEL
  - CLAUDE_CODE_EFFORT_LEVEL
notes:
  - DeepSeek through Anthropic-compatible endpoint.
  - Harbor display model may still look Anthropic; use observed-model extraction from logs.
