name: Phase 3 Dashboard CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase3-dashboard-ci.yml"
      - "apps/dashboard/**"
  pull_request:
    paths:
      - ".github/workflows/phase3-dashboard-ci.yml"
      - "apps/dashboard/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
